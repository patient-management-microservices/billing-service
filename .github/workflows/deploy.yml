name: Deploy Billing Service

on:
  workflow_run:
    workflows: ["Build and Publish Docker Image"]
    types:
      - completed

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    runs-on: self-hosted

    steps:
      - name: Deploy Billing Service
        run: |
          cd /home/dilshanjay/Apps/patient-management/patient-management-devops

          echo "Updating DevOps repository..."
          git fetch origin
          git reset --hard origin/main

          echo "Pulling latest billing-service image..."
          docker compose pull billing-service

          echo "Restarting billing-service..."
          docker compose up -d billing-service

          echo "Deployment completed!"